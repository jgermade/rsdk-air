# Manual release: bumps the version, builds and tests (build.yml), creates the tag and the
# GitHub Release with the four builds, and deploys the landing page to GitHub Pages.
#
# enable_plus is for the owner's private copy only: it fails on a public repository and
# never deploys Pages (Pages sites are public). See
# ROADMAP/2026-11-20/upstreams-and-licensing.md.
name: release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump"
        type: choice
        options: [patch, minor, major]
        default: patch
      enable_plus:
        description: "Plus DLC (private repositories only, personal use)"
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Guard
        env:
          PLUS: ${{ inputs.enable_plus }}
          PRIVATE: ${{ github.event.repository.private }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Releases are made from main only (got $GITHUB_REF)."
            exit 1
          fi
          if [ "$PLUS" = "true" ] && [ "$PRIVATE" != "true" ]; then
            echo "::error::enable_plus is only allowed in a private repository: the RSDK licenses forbid distributing builds with Plus DLC on."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          last=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)
          last=${last:-v0.0.0}
          IFS=. read -r major minor patch <<< "${last#v}"
          case "$BUMP" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          version="$major.$minor.$patch"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "::error::Tag v$version already exists."
            exit 1
          fi
          echo "Last release: $last -> v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      enable_plus: ${{ inputs.enable_plus }}

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          PLUS: ${{ inputs.enable_plus }}
        run: |
          {
            echo "rsdk-air $TAG"
            echo
            if [ "$PLUS" = "true" ]; then
              echo "**Personal build with Plus DLC enabled. Do not share it with anyone.**"
              echo
            fi
            echo "No game data is included: you need your own files (see the landing page)."
            echo
            echo "rsdk-air is under the MIT License. The engines keep their own licenses"
            echo "(non-commercial RSDK decompilation licenses; GPL-3.0 for Sonic 3 A.I.R.),"
            echo "included in each archive under licenses/. Source code: this repository at $TAG,"
            echo "with the engines as pinned git submodules."
            echo
            echo "Not affiliated with or endorsed by SEGA."
          } > notes.md
          ls -l dist
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "rsdk-air $TAG" \
            --notes-file notes.md

  pages:
    needs: [prepare, publish]
    if: ${{ inputs.enable_plus != true }}
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build site
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          mkdir -p _site
          cp -R site/. _site/
          sed -i -e "s|__REPOSITORY__|$GITHUB_REPOSITORY|g" -e "s|__VERSION__|$VERSION|g" _site/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
