plugins {
    id 'com.android.application'
}

def rsdkairVersion = project.property('rsdkairVersion').toString()
def rsdkairEnablePlus = project.property('rsdkairEnablePlus').toString().toBoolean()

// versionCode from X.Y.Z (dev builds: 1).
def versionMatch = (rsdkairVersion =~ /^(\d+)\.(\d+)\.(\d+)/)
def rsdkairVersionCode = versionMatch.find()
    ? versionMatch.group(1).toInteger() * 10000 + versionMatch.group(2).toInteger() * 100 + versionMatch.group(3).toInteger()
    : 1
if (rsdkairVersionCode < 1) rsdkairVersionCode = 1

android {
    namespace 'org.rsdkair.launcher'
    compileSdk 35
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'org.rsdkair.launcher'
        minSdk 24
        targetSdk 35
        versionCode rsdkairVersionCode
        versionName rsdkairVersion

        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_shared',
                          '-DRSDKAIR_BUILD_TESTS=OFF',
                          "-DRSDKAIR_VERSION=${rsdkairVersion}",
                          "-DRSDKAIR_ENABLE_PLUS=${rsdkairEnablePlus ? 'ON' : 'OFF'}"
                targets 'rsdk-air', 'SDL2', 'rsdkv3', 'rsdkv4', 'rsdkv5'
            }
        }
        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }

    externalNativeBuild {
        cmake {
            path '../../CMakeLists.txt'
            version '3.22.1'
        }
    }

    sourceSets {
        main {
            // SDL's Java side (SDLActivity and friends), used as is from the submodule.
            java.srcDirs += '../../third_party/SDL/android-project/app/src/main/java'
            // The picker's art/ and fonts/, staged by copyPickerAssets below.
            assets.srcDirs += layout.buildDirectory.dir('generated/picker-assets')
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Installable without a keystore for now: signed with the build machine's
            // debug key, so CI builds cannot update each other in place. M5 adds a real
            // release key (repository secret).
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}

// The picker reads art/covers/*.jpg and fonts/*.ttf from the APK's assets, the same relative
// paths it uses next to the desktop executable. licenses/ holds the license of everything
// the APK contains, named as in the desktop downloads (CMakeLists.txt, install rules); the
// Credits screen points to it. No GLEW (desktop only) and no Sonic 3 A.I.R. (its own app).
def apkLicenses = [
    'LICENSE'                                                            : 'rsdk-air.txt',
    'third_party/SDL/LICENSE.txt'                                        : 'SDL2.txt',
    'third_party/RSDKv3-Decompilation/LICENSE.md'                        : 'RSDKv3-Decompilation.md',
    'third_party/RSDKv4-Decompilation/LICENSE.md'                        : 'RSDKv4-Decompilation.md',
    'third_party/RSDKv5-Decompilation/LICENSE.md'                        : 'RSDKv5-Decompilation.md',
    'third_party/Sonic-Mania-Decompilation/LICENSE.md'                   : 'Sonic-Mania-Decompilation.md',
    'third_party/ogg/COPYING'                                            : 'libogg.txt',
    'third_party/vorbis/COPYING'                                         : 'libvorbis.txt',
    'third_party/theora/COPYING'                                         : 'libtheora.txt',
    'third_party/RSDKv5-Decompilation/dependencies/all/iniparser/LICENSE': 'iniparser.txt',
    'third_party/RSDKv5-Decompilation/dependencies/all/miniz/LICENSE.md' : 'miniz.md',
    'third_party/RSDKv5-Decompilation/dependencies/all/stb_vorbis/LICENSE': 'stb_vorbis.txt',
    'third_party/RSDKv3-Decompilation/dependencies/all/theoraplay/LICENSE.txt': 'theoraplay.txt',
    'third_party/RSDKv4-Decompilation/dependencies/all/tinyxml2/LICENSE.txt': 'tinyxml2.txt',
    'third_party/stb/LICENSE'                                            : 'stb.txt',
    'third_party/imgui/LICENSE.txt'                                      : 'imgui.txt',
    'assets/fonts/Inter-LICENSE.txt'                                     : 'Inter-OFL.txt',
]
def copyPickerAssets = tasks.register('copyPickerAssets', Sync) {
    from('../../art') { into 'art' }
    from('../../assets/fonts') { into 'fonts' }
    apkLicenses.each { source, name ->
        from("../../${source}") {
            into 'licenses'
            rename { name }
        }
    }
    into layout.buildDirectory.dir('generated/picker-assets')
}
tasks.named('preBuild') { dependsOn copyPickerAssets }
